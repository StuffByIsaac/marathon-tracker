<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo 2027 Training Tracker</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const CheckCircle = ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Circle = ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <circle cx="12" cy="12" r="9" />
            </svg>
        );

        const Activity = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );

        const Dumbbell = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
            </svg>
        );

        const Trophy = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
            </svg>
        );

        const createStandardWeek = (weekNum, run1, run2, run3) => {
            return {
                week: weekNum,
                sessions: [
                    { id: `w${weekNum}-1`, day: 'Monday', type: 'strength', title: 'S&C Lower Body & Mobility', desc: 'Lunges, squats, calf raises, core.' },
                    { id: `w${weekNum}-2`, day: 'Tuesday', type: 'run', title: 'Quality / Speed', desc: run1 },
                    { id: `w${weekNum}-3`, day: 'Wednesday', type: 'strength', title: 'S&C Upper Body & Mobility', desc: 'Upper body, core, and deep stretching/yoga.' },
                    { id: `w${weekNum}-4`, day: 'Thursday', type: 'run', title: 'Aerobic Maintenance', desc: run2 },
                    { id: `w${weekNum}-5`, day: 'Saturday', type: 'run', title: 'Long Run', desc: run3 }
                ]
            };
        };

        const generatePlanData = () => {
            const plan = [];
            
            // Phase 1: Base Rebuilding
            const p1Run1 = "Fartlek: 45 mins total. Warm up, 8 x 1-min hard efforts (2 mins easy jog between).";
            plan.push(createStandardWeek(1, p1Run1, "6 to 8 km relaxed, conversational pace.", "10 km strictly easy pace."));
            plan.push(createStandardWeek(2, p1Run1, "6 to 8 km relaxed, conversational pace.", "12 km strictly easy pace."));
            plan.push(createStandardWeek(3, p1Run1, "6 to 8 km relaxed, conversational pace.", "14 km strictly easy pace."));
            plan.push(createStandardWeek(4, p1Run1, "6 to 8 km relaxed, conversational pace.", "16 km strictly easy pace."));
            plan.push(createStandardWeek(5, p1Run1, "6 to 8 km relaxed, conversational pace.", "14 km strictly easy pace. (Cutback week)"));

            const p2Run1 = "Tempo: 15 mins warm-up, 20–30 mins at Tempo Pace, 10 mins cool-down.";
            const p2Run2 = "8 to 10 km easy. Add 4 x 20-second strides at the end.";
            plan.push(createStandardWeek(6, p2Run1, p2Run2, "18 km easy pace."));
            plan.push(createStandardWeek(7, p2Run1, p2Run2, "20 km easy pace."));
            plan.push(createStandardWeek(8, p2Run1, p2Run2, "22 km easy pace."));
            plan.push(createStandardWeek(9, p2Run1, p2Run2, "18 km easy pace. (Cutback week)"));
            plan.push(createStandardWeek(10, p2Run1, p2Run2, "24 km. Integrate last 5km at Marathon Pace (MP)."));
            plan.push(createStandardWeek(11, p2Run1, p2Run2, "24 km. Integrate last 5km at Marathon Pace (MP)."));
            plan.push(createStandardWeek(12, p2Run1, p2Run2, "26 km. Integrate last 5km at Marathon Pace (MP)."));

            const p3Run1 = "Intervals: 4 x 2km slightly faster than MP, with 3 mins jogging recovery.";
            const p3Run2 = "10 km easy pace.";
            plan.push(createStandardWeek(13, p3Run1, p3Run2, "28 km. Mostly easy."));
            plan.push(createStandardWeek(14, p3Run1, p3Run2, "30 km. Mostly easy."));
            plan.push(createStandardWeek(15, p3Run1, p3Run2, "24 km easy pace. (Cutback week)"));
            plan.push(createStandardWeek(16, p3Run1, p3Run2, "32 km. Run the middle 10km at strict Marathon Pace."));
            plan.push(createStandardWeek(17, p3Run1, p3Run2, "32 km. Run the middle 15km at strict Marathon Pace."));

            plan.push(createStandardWeek(18, "Tempo: 30 mins.", "8 km easy pace.", "20 km (mostly easy, last 3km at MP)."));
            plan.push(createStandardWeek(19, "Intervals: 4 x 800m fast.", "6 km easy pace.", "12 km easy pace."));
            
            // Week 20 is custom
            plan.push({
                week: 20,
                sessions: [
                    { id: `w20-1`, day: 'Monday', type: 'strength', title: 'Light Stretch / Mobility', desc: 'Gentle stretching and mobility work. No heavy lifting.' },
                    { id: `w20-2`, day: 'Tuesday', type: 'run', title: 'Taper Run', desc: '20 mins easy with a few short sprints to stay sharp.' },
                    { id: `w20-3`, day: 'Thursday', type: 'run', title: 'Shakeout', desc: '5 km very easy shakeout.' },
                    { id: `w20-4`, day: 'Sunday', type: 'race', title: 'TOKYO MARATHON', desc: 'Race day! Target time: 3:30 (4:58/km).' }
                ]
            });

            return plan;
        };

        const PLAN_DATA = generatePlanData();

        function App() {
            // Local state for checking off workouts
            const [completedSessions, setCompletedSessions] = React.useState({});
            const [currentWeek, setCurrentWeek] = React.useState(1);

            // Calculate total progress
            const totalSessions = PLAN_DATA.reduce((acc, week) => acc + week.sessions.length, 0);
            const completedCount = Object.keys(completedSessions).filter(k => completedSessions[k]).length;
            const progressPercentage = Math.round((completedCount / totalSessions) * 100) || 0;

            const toggleSession = (id) => {
                setCompletedSessions(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            };

            const activeWeekData = PLAN_DATA.find(w => w.week === currentWeek);

            return (
                <div className="min-h-screen pb-20 md:pb-10">
                    {/* Header */}
                    <header className="bg-slate-900 text-white sticky top-0 z-10 shadow-md">
                        <div className="max-w-3xl mx-auto px-4 py-5">
                            <h1 className="text-2xl font-bold tracking-tight mb-1">Tokyo 2027 Tracker</h1>
                            <p className="text-slate-400 text-sm mb-4">Target: 3:30 • 20 Week Plan</p>
                            
                            {/* Progress Bar */}
                            <div className="flex items-center justify-between text-xs font-semibold mb-2">
                                <span>Overall Progress</span>
                                <span>{completedCount} / {totalSessions} ({progressPercentage}%)</span>
                            </div>
                            <div className="w-full bg-slate-800 rounded-full h-2.5">
                                <div 
                                    className="bg-blue-500 h-2.5 rounded-full transition-all duration-500 ease-out" 
                                    style={{ width: `${progressPercentage}%` }}
                                ></div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto px-4 py-6">
                        
                        <div className="flex items-center justify-between mb-6 bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                            <button 
                                onClick={() => setCurrentWeek(Math.max(1, currentWeek - 1))}
                                disabled={currentWeek === 1}
                                className={`p-2 rounded-lg font-medium text-sm transition-colors ${currentWeek === 1 ? 'text-slate-300' : 'text-blue-600 hover:bg-blue-50 active:bg-blue-100'}`}
                            >
                                ← Prev
                            </button>
                            
                            <select 
                                value={currentWeek} 
                                onChange={(e) => setCurrentWeek(Number(e.target.value))}
                                className="font-semibold text-lg bg-transparent focus:outline-none cursor-pointer text-center appearance-none"
                            >
                                {PLAN_DATA.map(w => (
                                    <option key={w.week} value={w.week}>Week {w.week}</option>
                                ))}
                            </select>

                            <button 
                                onClick={() => setCurrentWeek(Math.min(20, currentWeek + 1))}
                                disabled={currentWeek === 20}
                                className={`p-2 rounded-lg font-medium text-sm transition-colors ${currentWeek === 20 ? 'text-slate-300' : 'text-blue-600 hover:bg-blue-50 active:bg-blue-100'}`}
                            >
                                Next →
                            </button>
                        </div>

                        <div className="space-y-4">
                            {activeWeekData.sessions.map((session) => {
                                const isCompleted = !!completedSessions[session.id];
                                
                                // Determine styling based on workout type
                                let typeColor = "text-blue-600";
                                let typeBg = "bg-blue-50";
                                let Icon = Activity;
                                
                                if (session.type === 'strength') {
                                    typeColor = "text-purple-600";
                                    typeBg = "bg-purple-50";
                                    Icon = Dumbbell;
                                } else if (session.type === 'race') {
                                    typeColor = "text-amber-600";
                                    typeBg = "bg-amber-50";
                                    Icon = Trophy;
                                }

                                return (
                                    <div 
                                        key={session.id}
                                        onClick={() => toggleSession(session.id)}
                                        className={`flex items-start p-4 rounded-xl border-2 transition-all cursor-pointer active:scale-[0.99] select-none
                                            ${isCompleted 
                                                ? 'bg-slate-50 border-slate-200 opacity-60' 
                                                : 'bg-white border-transparent shadow-sm hover:shadow-md'
                                            }`}
                                    >
                                        <div className="flex-shrink-0 mr-4 mt-1">
                                            {isCompleted ? (
                                                <CheckCircle className="w-7 h-7 text-green-500" />
                                            ) : (
                                                <Circle className="w-7 h-7 text-slate-300" />
                                            )}
                                        </div>
                                        
                                        <div className="flex-grow">
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="text-sm font-bold text-slate-400 uppercase tracking-wider">{session.day}</span>
                                                <span className={`text-xs font-semibold px-2 py-1 rounded-md flex items-center gap-1 ${typeBg} ${typeColor}`}>
                                                    <Icon className="w-3.5 h-3.5" />
                                                    {session.type.charAt(0).toUpperCase() + session.type.slice(1)}
                                                </span>
                                            </div>
                                            <h3 className={`text-lg font-bold mb-1 ${isCompleted ? 'text-slate-500 line-through decoration-slate-400' : 'text-slate-800'}`}>
                                                {session.title}
                                            </h3>
                                            <p className={`text-sm leading-relaxed ${isCompleted ? 'text-slate-400' : 'text-slate-600'}`}>
                                                {session.desc}
                                            </p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mt-10 bg-slate-100 p-5 rounded-xl border border-slate-200">
                            <h3 className="text-sm font-bold text-slate-800 mb-3 uppercase tracking-wider flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                Target Paces (3:30 Goal)
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <div className="bg-white p-3 rounded-lg shadow-sm">
                                    <div className="text-xs text-slate-500 font-semibold mb-1">Marathon Pace (MP)</div>
                                    <div className="font-bold text-slate-900 text-lg">4:58 <span className="text-sm font-normal text-slate-500">/km</span></div>
                                </div>
                                <div className="bg-white p-3 rounded-lg shadow-sm">
                                    <div className="text-xs text-slate-500 font-semibold mb-1">Tempo Pace</div>
                                    <div className="font-bold text-slate-900 text-lg">4:35 - 4:45 <span className="text-sm font-normal text-slate-500">/km</span></div>
                                </div>
                                <div className="bg-white p-3 rounded-lg shadow-sm">
                                    <div className="text-xs text-slate-500 font-semibold mb-1">Easy / Long Pace</div>
                                    <div className="font-bold text-slate-900 text-lg">5:35 - 6:00 <span className="text-sm font-normal text-slate-500">/km</span></div>
                                </div>
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
